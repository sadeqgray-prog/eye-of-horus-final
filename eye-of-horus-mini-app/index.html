<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چشم هوروس</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        .menu-item {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
        }
        .menu-item:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.2);
        }
        .menu-item .emoji {
            font-size: 2.5em;
            margin-bottom: 10px;
            display: block;
        }
        .menu-item .title {
            font-size: 1.2em;
            font-weight: bold;
        }
        .status-bar {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 30px;
            text-align: center;
        }
        .back-button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>𓂀 چشم هوروس</h1>
        
        <div id="main-menu">
            <div class="menu-grid">
                <div class="menu-item" onclick="navigateTo('numerology')">
                    <span class="emoji">🔢</span>
                    <span class="title">عددشناسی</span>
                </div>
                <div class="menu-item" onclick="navigateTo('crypto')">
                    <span class="emoji">🚀</span>
                    <span class="title">کریپتو</span>
                </div>
                <div class="menu-item" onclick="navigateTo('dreams')">
                    <span class="emoji">💭</span>
                    <span class="title">رویاها</span>
                </div>
                <div class="menu-item" onclick="navigateTo('knowledge')">
                    <span class="emoji">📚</span>
                    <span class="title">دانش</span>
                </div>
            </div>
            
            <div class="status-bar" id="status">
                🤖 مغز متفکر فعال
            </div>
        </div>

        <div id="numerology-page" style="display: none;">
            <h2>🔢 عددشناسی</h2>
            <input type="text" id="name-input" placeholder="نام خود را وارد کنید" style="width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none;">
            <button class="back-button" onclick="calculateNumerology()">محاسبه</button>
            <div id="numerology-result"></div>
            <button class="back-button" onclick="showMainMenu()">🔙 بازگشت</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        
        // تنظیمات اولیه
        tg.expand(); // تمام صفحه
        tg.MainButton.text = "بستن";
        tg.MainButton.show();
        tg.MainButton.onClick(() => tg.close());

        function navigateTo(page) {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById(page + '-page').style.display = 'block';
            
            // ارسال به ربات که کاربر وارد صفحه شده
            tg.sendData(JSON.stringify({
                action: 'navigate',
                page: page
            }));
        }

        function showMainMenu() {
            document.querySelectorAll('[id$="-page"]').forEach(el => {
                el.style.display = 'none';
            });
            document.getElementById('main-menu').style.display = 'block';
        }

        function calculateNumerology() {
            const name = document.getElementById('name-input').value;
            if (name) {
                // ارسال نام به ربات برای محاسبه
                tg.sendData(JSON.stringify({
                    action: 'numerology',
                    name: name
                }));
            }
        }

        // دریافت داده از ربات
        window.addEventListener('message', function(event) {
            // اینجا داده‌هایی که ربات می‌فرسته دریافت می‌شه
            console.log('Received from bot:', event.data);
        });
    </script>
</body>
</html>
